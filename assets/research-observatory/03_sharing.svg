<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="white"/>
<text x="70" y="80" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#172633" font-weight="bold">Mortality inside and outside the transplant system</text>
<text x="70" y="126" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#4c5d6a" font-weight="normal">Estimated effects of eliminating geographic allocation boundaries</text>
<rect x="55" y="248" width="1490" height="75" fill="#edf2f5"/>
<text x="70" y="295" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#172633" font-weight="bold">Outcome</text>
<text x="820" y="295" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#172633" font-weight="bold">Estimate (SE)</text>
<text x="1110" y="295" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#172633" font-weight="bold">Units</text>
<line x1="55" y1="451" x2="1545" y2="451" stroke="#d2dbe0"/>
<text x="70" y="399" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#172633" font-weight="normal">Waitlist mortality (DSA-level)</text>
<text x="820" y="399" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="bold">-2.53 (0.48)</text>
<text x="1110" y="399" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="normal">Deaths / 1,000 waitlisted /</text>
<text x="1110" y="433" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="normal">month</text>
<line x1="55" y1="583" x2="1545" y2="583" stroke="#d2dbe0"/>
<text x="70" y="531" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#172633" font-weight="normal">One-year post-transplant mortality</text>
<text x="820" y="531" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="bold">-1.72 (0.32)</text>
<text x="1110" y="531" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="normal">Percentage points</text>
<line x1="55" y1="715" x2="1545" y2="715" stroke="#d2dbe0"/>
<text x="70" y="663" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#172633" font-weight="normal">Transplant-amenable mortality</text>
<text x="820" y="663" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="bold">+0.61 (0.20)</text>
<text x="1110" y="663" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="normal">Deaths / million residents /</text>
<text x="1110" y="697" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="normal">month</text>
<text x="70" y="884" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#4c5d6a" font-weight="normal">Adapted from Sharing is Caring?, Table 5, cols. 2-3 (p. 44), and Table 7, col. 1 (p. 45).</text>
<text x="70" y="915" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#4c5d6a" font-weight="normal">SE = standard error. All displayed estimates: p &lt; 0.01. Primary population-mortality definition.</text>
<text x="70" y="946" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#4c5d6a" font-weight="normal">Different populations and denominators: these estimates must not be added or subtracted.</text>
</svg>