<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1600" height="1000" viewBox="0 0 1600 1000">
<rect width="1600" height="1000" fill="white"/>
<text x="70" y="80" font-family="DejaVu Sans, sans-serif" font-size="40" fill="#172633" font-weight="bold">NP independence and opioid prescribing</text>
<text x="70" y="126" font-family="DejaVu Sans, sans-serif" font-size="25" fill="#4c5d6a" font-weight="normal">All payers: estimated change in annual morphine milligram equivalents (MMEs)</text>
<rect x="55" y="248" width="1490" height="75" fill="#edf2f5"/>
<text x="70" y="295" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#172633" font-weight="bold">Provider group</text>
<text x="1000" y="295" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#172633" font-weight="bold">Change</text>
<text x="1300" y="295" font-family="DejaVu Sans, sans-serif" font-size="29" fill="#172633" font-weight="bold">p-value</text>
<line x1="55" y1="451" x2="1545" y2="451" stroke="#d2dbe0"/>
<text x="70" y="399" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#172633" font-weight="normal">NPs and physicians combined</text>
<text x="1000" y="399" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="bold">-4.688%</text>
<text x="1300" y="399" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="normal">&lt; 0.001</text>
<line x1="55" y1="583" x2="1545" y2="583" stroke="#d2dbe0"/>
<text x="70" y="531" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#172633" font-weight="normal">Nurse practitioners</text>
<text x="1000" y="531" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="bold">+4.468%</text>
<text x="1300" y="531" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="normal">0.027</text>
<line x1="55" y1="715" x2="1545" y2="715" stroke="#d2dbe0"/>
<text x="70" y="663" font-family="DejaVu Sans, sans-serif" font-size="28" fill="#172633" font-weight="normal">Physicians</text>
<text x="1000" y="663" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="bold">-6.352%</text>
<text x="1300" y="663" font-family="DejaVu Sans, sans-serif" font-size="27" fill="#172633" font-weight="normal">&lt; 0.001</text>
<text x="70" y="884" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#4c5d6a" font-weight="normal">Adapted from Nurse Practitioner Scope-of-Practice Laws and Opioid Prescribing, Table 2, p. 14.</text>
<text x="70" y="915" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#4c5d6a" font-weight="normal">Percentages reproduced from the published table; log-coefficient confidence intervals are in data/.</text>
<text x="70" y="946" font-family="DejaVu Sans, sans-serif" font-size="22" fill="#4c5d6a" font-weight="normal">MMEs measure opioid volume, not prescription counts. Results are for all payers combined.</text>
</svg>