source:
  path: assets/files/McMichael_CV.pdf
  cv_date: "September 2026"
  heading: "Selected Publications"
  relevant_pdf_pages: [1, 2, 3, 4]
  note: >-
    Entries are transcribed from the repository CV. Line wrapping, small-caps
    typography, and discretionary line-break hyphenation are normalized; titles,
    citation content, and parenthetical coauthor statements are retained.

scope:
  included_cv_sections:
    - Law Reviews
    - Peer-Reviewed Economic and Law Journals
    - Peer-Reviewed Medical and Health Policy Journals
    - Book Chapters
    - Short Academic Works
  absent_cv_sections:
    - Working Papers
    - Books / Book Projects
  excluded_cv_sections:
    - Primary Academic Appointment
    - Education
    - Clerkship
    - Other Academic Appointments
    - Teaching
    - Reviewer Service
  caution: >-
    The CV heading is Selected Publications, so this inventory must not be treated
    as an exhaustive bibliography or as authorization to publish or distribute any
    manuscript.

interpretation_rules:
  authorship: >-
    Benjamin J. McMichael is the CV owner. Each cv_coauthor_note reproduces only
    the parenthetical supplied by the CV. It is not converted into a full ordered
    author list, and "et al." is not expanded.
  status: >-
    Forthcoming is recorded only when the CV says forthcoming. Published is an
    assessment based on a completed dated citation within Selected Publications;
    it remains unverified outside the CV.
  topics: >-
    No Research-program or topic assignments are made in this planning inventory.
  identifiers_and_urls: >-
    The CV supplies no DOI, repository identifier, or publication URL for these
    entries. Empty lists are retained on every record.

